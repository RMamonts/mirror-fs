[package]
name = "mirrorfs"
description = "A Rust NFS Server implementation"
authors = ["Rmamonts"]
version = "0.0.0"
edition = "2021"
rust-version = "1.75.0"
publish = false


[dependencies]
# External dependencies
tokio = { version = "1.52", features = ["full", "time"] }
byteorder = "1.5.0"
num-derive = "0.4.2"
num-traits = "0.2.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
async-channel = "2.5.0"
crossbeam-queue = "0.3.12"
trait-variant = "0.1.2"
clap = { version = "4.5.61", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.6"
libc = "0.2"

# Gihub dependencies
nfs-mamont = { git = "https://github.com/RMamonts/nfs-mamont.git", rev = "e7d4d39ed59cc344f356685f34299e5e6b469529" }

[dev-dependencies]
tempfile = "3.27.0"
