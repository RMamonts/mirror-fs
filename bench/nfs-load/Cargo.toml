[package]
name = "nfs-load"
description = "Closed-loop ONC RPC load generator for NFSv3 servers"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
hdrhistogram = "7.5"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
debug = false
